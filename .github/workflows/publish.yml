# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade, add @n8n/node-cli@latest as a dev dependency using your package manager.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended, no long-lived secrets):
#   1. Log in to npmjs.com and open your package's settings.
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: <your-github-username-or-org>
#        Repository name:  <your-repo-name>
#        Workflow name:    publish.yml
#        Environment:      (leave blank unless you use GitHub Environments)
#   4. Leave the NPM_TOKEN secret unset in this repository. GitHub's OIDC
#      token is used instead — no secret ever touches your repo settings.
#
# Option B — npm Automation Token (fallback):
#   1. On npmjs.com: Access Tokens → Generate New Token → Granular Access Token.
#      Scope it to this package with "Read and write" publish permission.
#   2. In GitHub: Settings → Secrets and variables → Actions → New secret.
#      Name it NPM_TOKEN and paste the token value.
#
# Both options work with --provenance. Provenance is signed by GitHub's OIDC
# infrastructure regardless of how npm authentication is handled.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
# If you prefer tags with a "v" prefix (e.g. v0.2.0), change the filter to:
#   tags: ['v*.*.*']
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Locally, cut the release by hand so the hand-written CHANGELOG.md survives
# (`npm run release` runs release-it, whose auto-changelog hook would rewrite
# it). Note that `npm ci` needs Node LTS — isolated-vm does not compile
# against Node 26's V8 headers.
#
#   1. Rename CHANGELOG.md's "## Unreleased" heading to "## <version> - <date>".
#   2. npm version <version> --no-git-tag-version
#   3. git commit -am "Release <version>" && git tag <version>
#   4. git push origin main && git push origin <version>
#
# The tag push triggers this workflow, which publishes to npm with provenance
# and then creates the matching GitHub release. Release notes are taken from
# the "## <version>" section of CHANGELOG.md, so step 1 is what makes them
# read well; without a matching section, GitHub's generated notes are used.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          # Required so npm writes an .npmrc pointing at the registry it will
          # perform the OIDC trusted-publishing exchange against.
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Upgrade npm
        # npm's OIDC Trusted Publishing support requires npm >= 11.5.1, which is
        # newer than the npm bundled with the current Node LTS.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Release
        # Publishes to npm with a provenance attestation (requires id-token: write above).
        # Lint and build run automatically as part of the release process.
        #
        # Auth is via npm Trusted Publishing (OIDC) — no NPM_TOKEN needed. npm
        # detects the GitHub Actions OIDC token automatically and exchanges it
        # for a short-lived publish token. Configure the Trusted Publisher on
        # npmjs.com → package settings → Trusted Publishers (repo + this workflow).
        run: npm run release

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish

    permissions:
      # Only this job needs to write; the publish job stays read-only.
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags, so the previous tag can be found for the
          # "Full changelog" compare link.
          fetch-depth: 0

      - name: Build release notes
        id: notes
        # Pulls the "## <version>" section out of CHANGELOG.md (stopping at the
        # next "## " heading). If there is no section for this tag, the release
        # falls back to GitHub's auto-generated notes.
        env:
          VERSION: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          # Trim leading and trailing blank lines.
          sed -i -e '/./,$!d' release-notes.md
          printf '%s' "$(cat release-notes.md)" > release-notes.md

          if [ -s release-notes.md ]; then
            prev=$(git describe --tags --abbrev=0 "$VERSION^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              printf '\n\n**Full changelog:** %s/compare/%s...%s\n' \
                "$REPO_URL" "$prev" "$VERSION" >> release-notes.md
            else
              printf '\n' >> release-notes.md
            fi
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG.md section for $VERSION; using generated notes."
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          HAS_NOTES: ${{ steps.notes.outputs.has_notes }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to do."
            exit 0
          fi
          if [ "$HAS_NOTES" = "true" ]; then
            gh release create "$VERSION" --title "$VERSION" --notes-file release-notes.md --verify-tag
          else
            gh release create "$VERSION" --title "$VERSION" --generate-notes --verify-tag
          fi
